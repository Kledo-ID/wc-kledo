name: Deploy and Release Plugin
on:
  push:
    tags:
      - "*"
  # Re-attaches the plugin zip to the release of an existing tag without
  # committing anything to the WordPress.org SVN repository.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the plugin zip to (e.g. 1.7.4)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    # Runs before the deploy on purpose: a tag without its CHANGELOG.md section
    # stops here, before anything is committed to WordPress.org.
    - name: Build release notes
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        version="${TAG#v}"
        notes="${RUNNER_TEMP}/release-notes.md"

        # Read CHANGELOG.md from the commit the workflow runs on, not the
        # checked-out tag: on a tag push they are the same commit, while a
        # manual run must see the current changelog even for an older tag.
        git fetch --quiet --depth=1 origin "$GITHUB_SHA"
        git show "${GITHUB_SHA}:CHANGELOG.md" | awk -v version="$version" '
          { sub(/\r$/, "") }
          /^## / {
            if (in_version) exit
            split($0, heading, " ")
            if (heading[2] == version) { in_version = 1; next }
          }
          in_version { print }
        ' > "${notes}.changes"

        if ! grep -q '[^[:space:]]' "${notes}.changes"; then
          echo "::error file=CHANGELOG.md::No '## ${version}' section found in CHANGELOG.md"
          exit 1
        fi

        # GitHub always lists its own "Source code" archives under Assets and
        # they cannot be removed, so the plugin zip is linked first instead.
        {
          echo "**⬇️ Unduh plugin: [kledo.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kledo.zip)**"
          echo
          echo "## Perubahan"
          cat "${notes}.changes"
          echo
          echo "## Cara install"
          echo
          echo "Unduh **kledo.zip** dari link di atas atau di bagian **Assets**. File *Source code (zip)* dan *Source code (tar.gz)* dibuat otomatis oleh GitHub dan bukan paket plugin yang siap install. Setelah itu upload lewat **Plugins » Add New » Upload Plugin** di admin WordPress. Panduan lengkap ada di [README](https://github.com/${GITHUB_REPOSITORY}/blob/HEAD/README.md#instalasi)."
        } > "$notes"

        echo "RELEASE_NOTES_PATH=${notes}" >> "$GITHUB_ENV"

    - name: Install SVN ( Subversion )
      run: |
        sudo apt-get update
        sudo apt-get install subversion

    - name: WordPress Plugin Deploy
      id: deploy
      uses: 10up/action-wordpress-plugin-deploy@stable
      with:
        generate-zip: true
        # A manual run only rebuilds the zip; SVN is never committed to.
        dry-run: ${{ github.event_name == 'workflow_dispatch' }}
      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SLUG: kledo
        # Empty on a tag push, where the action reads the version from the tag
        # ref. A manual run is on a branch ref, so the tag must be passed in.
        VERSION: ${{ inputs.tag }}

    # The deploy action names the zip after SLUG (kledo.zip), not the repository
    # (wc-kledo), so take its path from the step output instead of rebuilding it.
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        body_path: ${{ env.RELEASE_NOTES_PATH }}
        files: ${{ steps.deploy.outputs.zip-path }}
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After a successful release, stamp the release date on the version's CHANGELOG.md heading on the
  # default branch: "## 1.8.0 (belum dirilis)" becomes "## 1.8.0 (2026-10-05)". CHANGELOG.md is
  # listed in .distignore, so it is not part of the WordPress.org package or kledo.zip — only the
  # repository copy needs the date, and it can be written after the tag without changing what was
  # released. Runs on a tag push only: a manual run re-attaches a zip to an old release and must
  # not touch the changelog.
  changelog-date:
    name: Stamp release date in CHANGELOG.md
    needs: tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout default branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Replace "(belum dirilis)" with the release date
      id: stamp
      env:
        TAG: ${{ github.ref_name }}
      run: |
        version="${TAG#v}"
        # The date the release went out, in the team's timezone.
        release_date="$(TZ=Asia/Jakarta date +%Y-%m-%d)"
        escaped_version="$(printf '%s' "$version" | sed 's/[.]/\\./g')"

        # Only the heading of this version, keeping a CRLF line ending if the file has one.
        sed -i -E "s/^## ${escaped_version} \(belum dirilis\)(\r?)$/## ${version} (${release_date})\1/" CHANGELOG.md

        if git diff --quiet -- CHANGELOG.md; then
          echo "No '## ${version} (belum dirilis)' heading on the default branch; nothing to update."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_date=${release_date}" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push
      if: steps.stamp.outputs.changed == 'true'
      env:
        BRANCH: ${{ github.event.repository.default_branch }}
        VERSION: ${{ steps.stamp.outputs.version }}
        RELEASE_DATE: ${{ steps.stamp.outputs.release_date }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md
        git commit -m "docs(changelog): tanggal rilis ${VERSION} (${RELEASE_DATE})"

        # Someone may have pushed since the checkout; rebase once and retry rather than fail.
        if ! git push origin "HEAD:${BRANCH}"; then
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
        fi
