name: Inspections

on:
  pull_request:
    paths:
      - '**.php'
      - 'phpcs.xml'
      - 'phpcs.xml.dist'
      - '.phpcs.xml'
      - '.phpcs.xml.dist'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runPHPCSInspection:
    name: Run PHPCS Inspection (WordPress Coding Standards)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2, cs2pr
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-wpcs-phpcs3.13-wpcs3.3
          restore-keys: |
            ${{ runner.os }}-composer-wpcs-

      - name: Initialize Composer project (if not present)
        run: |
          if [ ! -f composer.json ]; then
            composer init \
              --no-interaction \
              --name=temp/wpcs-check \
              --type=project \
              --stability=dev
          fi

      - name: Configure Composer plugins
        run: |
          composer config --no-interaction \
            allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install PHPCS and WordPress Coding Standards
        run: |
          composer require --no-interaction --dev \
            squizlabs/php_codesniffer:^3.13 \
            wp-coding-standards/wpcs:^3.3 \
            dealerdirect/phpcodesniffer-composer-installer:^1.2

      - name: Verify installed standards
        run: vendor/bin/phpcs -i

      - name: Get changed PHP files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: '**.php'

      - name: Assert project PHPCS ruleset is present
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ -f phpcs.xml ] || [ -f phpcs.xml.dist ] || [ -f .phpcs.xml ] || [ -f .phpcs.xml.dist ]; then
            exit 0
          fi
          echo '::error::Add a project ruleset (phpcs.xml or phpcs.xml.dist). Inline --standard=WordPress is not used; PHPCS is driven only by the ruleset in this repository.'
          exit 1

      - name: Run PHPCS (project ruleset, checkstyle, changed files)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          echo 'PHPCS loads ruleset from the repo (auto-discovery: phpcs.xml, phpcs.xml.dist, or hidden variants).'
          # Do not pass --standard or --ignore here; they belong in the ruleset.
          vendor/bin/phpcs \
            --report=checkstyle \
            ${{ steps.changed-files.outputs.all_changed_files }} \
            | cs2pr

      - name: No PHP files changed
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "✅ No PHP files changed in this pull request. Skipping PHPCS."
