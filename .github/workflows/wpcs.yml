name: Inspections

on:
  pull_request:

jobs:
  runPHPCSInspection:
    name: Run PHPCS inspection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          tools: composer

      - name: Prepare Composer project
        run: |
          composer init --no-interaction --name=temp/wpcs-check

      - name: Allow Composer plugin
        run: |
          composer config --no-interaction allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install coding standards
        run: |
          composer require --no-interaction --dev \
            squizlabs/php_codesniffer:^3.13 \
            wp-coding-standards/wpcs:^3.3 \
            dealerdirect/phpcodesniffer-composer-installer:^1.2

      - name: Show installed standards
        run: |
          vendor/bin/phpcs -i

      - name: Run PHPCS inspection
        run: |
          vendor/bin/phpcs \
            --standard=WordPress \
            --ignore=.github/*,.wordpress-org/*,languages/* \
            .
